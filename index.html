<script>
/* ── AUDIO ENGINE ── */
(function(){
  var audio = document.getElementById('bgAudio');
  var VOL = 0.42, wanted = false, audible = false, inFlight = null, fadeTimer = null;
  function fadeTo(target, done) {
    clearInterval(fadeTimer);
    var step = (target - audio.volume) / 22;
    fadeTimer = setInterval(function() {
      var v = audio.volume + step;
      if ((step>0&&v>=target)||(step<0&&v<=target)) {
        audio.volume = Math.max(0,Math.min(1,target));
        clearInterval(fadeTimer); if(done)done();
      } else { audio.volume = Math.max(0,Math.min(1,v)); }
    }, 40);
  }
  function rollSilently() {
    audio.muted=true; audio.volume=0;
    var p=audio.play(); if(p&&p.catch)p.catch(function(){});
  }
  function goAudible() {
    if(audible) return Promise.resolve(true);
    if(inFlight) return inFlight;
    var wasMuted = audio.muted;
    audio.muted=false; if(wasMuted){try{audio.currentTime=0;}catch(e){}} audio.volume=0;
    var p; try{p=audio.play();}catch(e){p=null;}
    var settle=function(ok){inFlight=null;return ok;};
    var win=function(){audible=true;fadeTo(VOL);return settle(true);};
    var lose=function(){audio.muted=wasMuted;if(wasMuted&&audio.paused)rollSilently();return settle(false);};
    if(!p||!p.then)return Promise.resolve(audio.paused?lose():win());
    inFlight=p.then(win,lose); return inFlight;
  }
  var ARM=['pointerdown','click','keydown','touchstart'];
  var armed=false;
  function kick(){if(!wanted||audible){disarm();return;}goAudible().then(function(ok){if(ok)disarm();});}
  function arm(){if(armed)return;armed=true;ARM.forEach(function(t){window.addEventListener(t,kick,{capture:true,passive:true});});}
  function disarm(){if(!armed)return;armed=false;ARM.forEach(function(t){window.removeEventListener(t,kick,true);});}
  function setSound(on) {
    wanted=on;
    try{sessionStorage.setItem('sk_sound',on?'1':'0');}catch(e){}
    if(on){goAudible().then(function(ok){if(!ok){rollSilently();arm();}});}
    else{audible=false;disarm();fadeTo(0,function(){audio.pause();});}
  }
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){audio.pause();audible=false;}
    else if(wanted){goAudible();}
  });
  window.addEventListener('pagehide',function(){audio.pause();});
  window.addEventListener('blur',function(){if(!document.hidden){audio.pause();audible=false;}});
  var soundOn=true;
  try{if(sessionStorage.getItem('sk_sound')==='0')soundOn=false;}catch(e){}
  if(soundOn){wanted=true;goAudible().then(function(ok){if(!ok){rollSilently();arm();}});}
  window.__audioCtrl={setSound:setSound,toggle:function(){setSound(!wanted);},isPlaying:function(){return !audio.paused&&!audio.muted;},audio:audio};
})();
</script>
